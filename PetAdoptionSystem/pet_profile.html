<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Adoption Center - QR Pet Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <aside>
        <h2>Pet Adoption Portal</h2>
        <a href="index.html">Dashboard</a>
        <a href="pets.html">Available Pets</a>
        <a href="pet_profile.html" class="active">QR Pet Profile</a>
        <a href="health.html">Health Monitoring</a>
    </aside>

    <main>
        <header>
            <h1>QR Pet Profile</h1>
            
        </header>

        <div class="profile-container">
            <div class="qr-box">
                [QR Code]
            </div>

            <div class="profile-details">
                <h2>[Pet Name]</h2>
                <p><strong>Pet ID:</strong> <span>[Insert Pet ID]</span></p>
                <p><strong>Species:</strong> <span>[Insert Species]</span></p>
                <p><strong>Breed:</strong> <span>[Insert Breed]</span></p>
                <p><strong>Age:</strong> <span>[Insert Age]</span></p>
                <p><strong>Gender:</strong> <span>[Insert Gender]</span></p>
                <p><strong>Adoption Status:</strong> <span>[Insert Status]</span></p>
                
            </div>
        </div>
    </main>

</body>
</html>
