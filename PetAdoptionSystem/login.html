<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Adoption Center - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🐾</div>
            <h2>Pet Adoption Portal</h2>
            <p>Select your role and sign in to continue</p>
        </div>

        <form action="index.html" method="GET" class="login-form">
            <!-- Role Selector Dropdown -->
            <div class="form-group">
                <label for="role">User Role</label>
                <div class="select-wrapper">
                    <select id="role" name="role" required>
                        <option value="Admin">Admin</option>
                        <option value="Staff">Staff</option>
                    </select>
                </div>
            </div>

            <!-- Username / Email Field -->
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="off">
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-block btn-primary">Sign In</button>
        </form>
    </div>

</body>
</html>
